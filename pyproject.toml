[project]
name = "ha-gradient-effects"
version = "0.1.3"
description = "Home Assistant integration: Hue-style gradients as light effects for Hue gradient and WLED strips"
requires-python = ">=3.14"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests/integration"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
